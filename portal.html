<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e5c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="نجود">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <title>My portal | حسابي — Nojood Nutrition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html"><img src="logo-mark.svg" alt="" class="logo-mark"><span data-i18n="brand">نجود للتغذية</span></a>
    <nav>
      <a href="index.html" data-i18n="nav_home">الرئيسية</a>
      <a href="index.html#packages" data-i18n="nav_packages">الباقات</a>
      <a href="start.html" class="guest-only" data-i18n="nav_start">ابدأ الآن</a>
      <a href="portal.html" data-i18n="nav_portal">حسابي</a>
      <button class="lang-btn" id="lang-btn" data-i18n="lang_btn">English</button>
    </nav>
  </header>

  <main>
    <p class="muted loading" id="loading" hidden data-i18n="loading"></p>

    <!-- Login -->
    <div class="card login-box" id="login-view">
      <h2 data-i18n="pt_login"></h2>
      <form id="login-form" novalidate>
        <div class="field"><label for="l-email" data-i18n="f_email"></label><input id="l-email" type="email" required autocomplete="email"></div>
        <div class="field" style="margin-top:12px"><label for="l-password" data-i18n="pw_label"></label><input id="l-password" type="password" required autocomplete="current-password"></div>
        <p class="error" id="login-err"></p>
        <button type="submit" class="btn" style="width:100%" data-i18n="pt_login_btn"></button>
      </form>
      <p class="muted" style="text-align:center"><span data-i18n="pt_no_account"></span> <a href="start.html" data-i18n="pt_start_link"></a></p>
      <button class="btn outline small demo-btn" type="button" onclick="startDemo('client')" data-i18n="demo_try_client"></button>
    </div>

    <!-- Client home -->
    <div id="dash-view" hidden>
      <div class="dash-head">
        <h2 style="margin:0"><span data-i18n="pt_hello"></span> <span id="d-name"></span></h2>
        <button class="btn outline small" id="logout-btn" data-i18n="pt_logout"></button>
      </div>

      <!-- InBody reminder from the dietitian -->
      <div class="card ib-alert" id="ib-alert" hidden>
        <h3 style="margin-top:0">📋 <span data-i18n="ib_alert_title"></span></h3>
        <p data-i18n="ib_alert_text"></p>
        <div class="form-grid">
          <div class="field"><label for="ib-weight" data-i18n="ib_weight"></label><input id="ib-weight" type="number" step="0.1"></div>
          <div class="field"><label for="ib-fat" data-i18n="ib_fat"></label><input id="ib-fat" type="number" step="0.1"></div>
          <div class="field"><label for="ib-muscle" data-i18n="ib_muscle"></label><input id="ib-muscle" type="number" step="0.1"></div>
        </div>
        <p class="error" id="ib-err"></p>
        <button class="btn" id="ib-submit" style="margin-top:12px" data-i18n="ib_submit"></button>
      </div>
      <p class="note" id="ib-thanks" hidden data-i18n="ib_thanks"></p>

      <!-- A: waiting for the dietitian to confirm the bank transfer -->
      <div class="card" id="v-wait" hidden style="margin-top:14px">
        <div id="wait-pending">
          <span class="status-pill" data-i18n="tr_pending"></span>
          <p class="note" data-i18n="pt_wait_bank"></p>
        </div>
        <div id="wait-rejected" hidden>
          <span class="status-pill bad" data-i18n="tr_rejected"></span>
          <p data-i18n="tr_rejected_text"></p>
          <div class="field"><label for="re-receipt" data-i18n="tr_reupload"></label><input id="re-receipt" type="file" accept="image/*,application/pdf"></div>
          <p class="error" id="re-err"></p>
          <button class="btn" id="re-send" data-i18n="tr_submit"></button>
        </div>
      </div>

      <!-- A2: paid, waiting for the dietitian to set the calories -->
      <div class="card" id="v-kcal-wait" hidden style="margin-top:14px">
        <span class="status-pill" data-i18n="kw_pill"></span>
        <p class="note" data-i18n="kw_text"></p>
      </div>

      <!-- B: choose 7 days for the month -->
      <div id="v-build" hidden style="margin-top:14px">
        <div class="card">
          <h3 style="margin-top:0" data-i18n="b_title"></h3>
          <p class="muted" style="margin:0" data-i18n="b_sub"></p>
          <p class="stat" style="margin:10px 0 0"><span data-i18n="b_count"></span> <bdi dir="ltr"><span id="b-count">0</span> / 7</bdi></p>
        </div>
        <div class="tabs" style="margin-top:14px">
          <button class="tab active" data-btab="ready" data-i18n="tab_ready"></button>
          <button class="tab" data-btab="custom" data-i18n="tab_custom"></button>
        </div>
        <div id="b-ready">
          <p class="muted"><span data-i18n="pt_choose_sub"></span> (<b id="b-kcal"></b> <span data-i18n="kcal_short"></span>)</p>
          <div class="sched-list" id="b-ready-list"></div>
          <p class="note" id="b-no-ready" hidden data-i18n="b_no_ready"></p>
        </div>
        <div id="b-custom" class="card" hidden>
          <p class="muted" style="margin-top:0" data-i18n="b_custom_sub"></p>
          <div class="kcal-row">
            <div><span class="muted small-label" data-i18n="b_target"></span><b id="c-target"></b></div>
            <div><span class="muted small-label" data-i18n="b_total"></span><b id="c-total"></b></div>
            <div><span class="muted small-label" data-i18n="b_remaining"></span><b id="c-left"></b></div>
          </div>
          <div class="form-grid" id="c-slots" style="margin-top:12px"></div>
          <button class="btn" id="c-add" style="margin-top:14px" data-i18n="b_add_day"></button>
        </div>
        <div class="card" style="margin-top:14px">
          <h3 style="margin-top:0" data-i18n="b_your_days"></h3>
          <ul class="meal-list chosen-days" id="b-chosen"></ul>
          <p class="muted" style="font-size:.85rem" data-i18n="b_confirm_note"></p>
          <p class="error" id="b-err"></p>
          <button class="btn" id="b-save" disabled data-i18n="b_save"></button>
        </div>
      </div>

      <!-- C: pick today's plan -->
      <div id="v-pick" hidden style="margin-top:14px">
        <h3 data-i18n="p_title" style="margin-bottom:4px"></h3>
        <p class="muted" style="margin-top:0" data-i18n="p_sub"></p>
        <button class="btn outline off-btn" type="button" data-offday>🌿 <span data-i18n="off_btn"></span></button>
        <div class="sched-list" id="pick-list"></div>
      </div>

      <!-- Off day -->
      <div class="card finished" id="v-off" hidden style="margin-top:14px">
        <div class="avatar" style="margin:0 auto">🌿</div>
        <h3 data-i18n="off_title"></h3>
        <p data-i18n="off_text"></p>
        <button class="btn outline" id="off-cancel" type="button" data-i18n="off_cancel"></button>
      </div>

      <!-- D: today's meals one by one -->
      <div id="v-plan" hidden>
        <div class="card progress-card" style="margin-top:14px">
          <p class="muted small-label" data-i18n="ad_today"></p>
          <h3 id="p-sched" style="margin:0 0 8px"></h3>
          <div class="progress-top">
            <div><p class="muted small-label" data-i18n="pt_meals_done"></p><p class="stat"><bdi dir="ltr"><span id="p-done"></span> / <span id="p-total"></span></bdi></p></div>
            <div><p class="muted small-label" data-i18n="pt_today_kcal"></p><p class="stat"><bdi dir="ltr"><span id="p-kcal"></span> / <span id="p-target"></span></bdi></p></div>
            <div><p class="muted small-label" data-i18n="t_days_followed"></p><p class="stat" id="p-days"></p></div>
          </div>
          <div class="bar"><div class="bar-fill" id="p-bar"></div></div>
          <button class="link-btn" id="change-day" data-i18n="t_change"></button>
        </div>

        <button class="btn outline off-btn" type="button" data-offday>🌿 <span data-i18n="off_btn"></span></button>

        <div class="card next-meal" id="next-card">
          <p class="eyebrow" data-i18n="pt_next"></p>
          <p class="meal-type" id="n-type"></p>
          <h3 id="n-name"></h3>
          <p class="meal-meta"><b id="n-kcal"></b> <span data-i18n="kcal_short"></span> · <span id="n-protein"></span> <span data-i18n="protein_short"></span> <span id="n-portion"></span></p>
          <details open><summary data-i18n="pt_ingredients"></summary><p id="n-ing"></p></details>
          <details><summary data-i18n="pt_how"></summary><p id="n-steps"></p></details>
          <div class="btn-row" style="justify-content:flex-start;margin-top:14px">
            <button class="btn" id="done-btn" data-i18n="btn_done"></button>
            <button class="btn outline" id="skip-btn" data-i18n="btn_skip"></button>
          </div>
        </div>

        <div class="card finished" id="finished-card" hidden>
          <div class="avatar" style="margin:0 auto">🎉</div>
          <p data-i18n="t_done_today"></p>
          <button class="btn" id="next-sched" type="button" data-i18n="t_next_sched"></button>
        </div>

        <div class="card" style="margin-top:14px">
          <h3 data-i18n="pt_today" style="margin-top:0"></h3>
          <ul class="meal-list" id="today-list"></ul>
        </div>
      </div>

      <!-- Workout link from the dietitian -->
      <div class="card" style="margin-top:14px" id="workout-card" hidden>
        <h3 style="margin-top:0" data-i18n="wk_title"></h3>
        <a class="btn" id="wk-link" href="#" target="_blank" rel="noopener" hidden data-i18n="wk_open"></a>
        <p class="note" id="wk-none" data-i18n="wk_none"></p>
      </div>

      <p class="demo-note" data-i18n="pt_demo"></p>
    </div>
  </main>

  <footer data-i18n="footer_note"></footer>

  <script src="i18n.js"></script>
  <script src="recipes.js"></script>
  <script src="db.js"></script>
  <script src="demo-db.js"></script>
  <script src="app.js"></script>
</body>
</html>
